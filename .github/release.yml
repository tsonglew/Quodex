# Used by GitHub's "Generate release notes"; does not publish or replace
# the signed-APK release notes generated by scripts/publish_release.sh.
changelog:
  categories:
    - title: "功能改进 / Features"
      labels: [enhancement]
    - title: "问题修复 / Fixes"
      labels: [bug]
    - title: "文档 / Documentation"
      labels: [documentation]
    - title: "依赖维护 / Dependencies"
      labels: [dependencies]
    - title: "其他改动 / Other changes"
      labels: ["*"]
