name: Retire closed PR preview
on:
  pull_request_target:
    types: [closed]
permissions:
  deployments: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This event has write access; never checkout or run any PR code here.
      - uses: actions/github-script@v9
        with:
          script: |
            const environment = `android-preview/pr-${context.payload.pull_request.number}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment, per_page: 100
            });
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo, deployment_id: deployment.id, state: 'inactive',
                description: 'Pull request closed', auto_inactive: false
              });
            }
