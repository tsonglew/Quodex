name: Android build and tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check-signing:
        description: Verify fixed signing after all tests (master only, no public Release)
        type: boolean
        default: false
      build-release:
        description: Also validate the minified release APK without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      check-signing:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
      build-release:
        type: boolean
        default: false
permissions:
  contents: read
env:
  BUILD_RELEASE: ${{ inputs.build-release || inputs.check-signing || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Validate workflows and delivery scripts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
          shellcheck scripts/*.sh
          python3 -m py_compile scripts/release_ui_smoke.py scripts/wait_for_android.py
          python3 -m unittest discover -s scripts/tests -v
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate delivery tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint and APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Package preview APK
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BUILD_SHA="$(git rev-parse HEAD)"
          python3 scripts/apk_artifact.py package \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output-metadata app/build/outputs/apk/debug/output-metadata.json \
            --destination artifacts/preview --source-sha "${PR_HEAD_SHA:-$BUILD_SHA}" --build-sha "$BUILD_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/preview/
          if-no-files-found: error
          retention-days: 14
      - name: Build unsigned release for signing job
        if: env.BUILD_RELEASE == 'true'
        run: ./gradlew lintRelease assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: env.BUILD_RELEASE == 'true'
        with:
          name: android-release-unsigned
          path: app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && env.BUILD_RELEASE == 'true'
        with:
          name: android-release-diagnostics
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-release.html
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
  device-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31, 35, 36, '37.0', '37.2']
        include:
          - api-level: 36
            ram-size: 4096M
          - api-level: '37.0'
            target: google_apis
            ram-size: 4096M
          - api-level: '37.2'
            target: google_apis_ps16k
            ram-size: 4096M
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        if: env.BUILD_RELEASE == 'true'
        with:
          name: android-release-unsigned
          path: release-unsigned
      - name: Install emulator runtime dependency
        if: ${{ startsWith(format('{0}', matrix.api-level), '37.') }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: ${{ !startsWith(format('{0}', matrix.api-level), '37.') }}
        env:
          RELEASE_APK: ${{ env.BUILD_RELEASE == 'true' && 'release-unsigned/app-release-unsigned.apk' || '' }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target || 'default' }}
          ram-size: ${{ matrix.ram-size || '2048M' }}
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device_ci.sh
      - name: Android 17 device tests with framework readiness checks
        if: ${{ startsWith(format('{0}', matrix.api-level), '37.') }}
        env:
          DEVICE_API: ${{ matrix.api-level }}
          DEVICE_TARGET: ${{ matrix.target }}
          RELEASE_APK: ${{ env.BUILD_RELEASE == 'true' && 'release-unsigned/app-release-unsigned.apk' || '' }}
        run: bash scripts/android17_device_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests-api-${{ matrix.api-level }}
          path: |
            screenshots/
            app/build/reports/androidTests/
          retention-days: 14
  ci:
    name: Android CI gate
    needs: [delivery, build, device-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and device check
        env:
          BUILD: ${{ needs.build.result }}
          DEVICES: ${{ needs.device-tests.result }}
          DELIVERY: ${{ needs.delivery.result }}
        run: test "$DELIVERY" = success && test "$BUILD" = success && test "$DEVICES" = success

  signing-check:
    name: Build fixed-signature APK
    needs: [ci, build]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.check-signing))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    environment:
      name: android-release
      url: ${{ github.event_name == 'push' && format('{0}/{1}/releases/tag/build-{2}-{3}', github.server_url, github.repository, github.run_id, github.run_attempt) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: android-release-unsigned
          path: unsigned
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Resolve candidate version
        id: candidate
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('unsigned/output-metadata.json').read_text())['elements'][0]['versionName']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
          PY
      - name: Verify signing without publishing
        env:
          RELEASE_SIGN_ONLY: 'true'
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/publish_release.sh
      - uses: actions/upload-artifact@v4
        id: signed-apk
        with:
          name: ${{ github.event_name == 'push' && 'android-signed-apk' || 'android-fixed-signature-check' }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish master APK to GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_build.py
      - name: APK download summary
        env:
          ARTIFACT_URL: ${{ steps.signed-apk.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          provenance = json.loads(Path('artifacts/release/provenance.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"[Download fixed-signature APK]({os.environ['ARTIFACT_URL']})\n\n")
              summary.write(f"Version: {provenance['tag'][1:]} (code {provenance['version_code']})\n\n")
              summary.write(f"Source: `{provenance['source_sha']}`\n\n")
              summary.write(f"APK SHA-256: `{provenance['sha256']}`\n\n")
              summary.write("Artifact retained for 14 days. Master push builds are also published to GitHub Releases; manual signing checks remain artifacts only.\n")
          PY
